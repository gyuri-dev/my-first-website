<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- 다크모드 깜빡임 방지: React 렌더 전 data-theme 즉시 적용 -->
    <script>
      (function(){
        try{
          var s=localStorage.getItem('portfolio-theme');
          var t=s||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
          document.documentElement.setAttribute('data-theme',t);
        }catch(e){}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
